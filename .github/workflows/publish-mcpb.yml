name: Publish MCPB Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run mcpb:build

      - uses: actions/upload-artifact@v4
        with:
          name: codeant-mcp-${{ steps.version.outputs.version }}
          path: dist/codeant.mcpb
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: codeant-mcp-${{ steps.version.outputs.version }}
          name: CodeAnt MCP v${{ steps.version.outputs.version }}
          files: dist/codeant.mcpb
          fail_on_unmatched_files: true
          body: |
            CodeAnt MCP bundle v${{ steps.version.outputs.version }}

            Commit: ${{ github.sha }}

            Install instructions: https://docs.codeant.ai/cli/mcp-server
